name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '배포 채널: testing은 Pre-release, stable은 정식 Latest'
        required: true
        type: choice
        default: testing
        options:
          - testing
          - stable
      version:
        description: '선택: 비우면 자동 결정. testing은 다음 정식 버전을 유지'
        required: false
        type: string
      build_number:
        description: '선택: 비우면 최신 빌드 번호 +1'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jibegaza-release
  cancel-in-progress: false

jobs:
  release:
    # Stable releases require the default branch; testing accepts a manually selected branch.
    if: github.repository == 'ghwaKim/jibegaza_menubar' && (inputs.channel == 'testing' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false

      - name: Determine and validate next release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 scripts/check_release.py

      - name: Configure public verification key
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: zsh scripts/setup_updates.sh "$SPARKLE_PUBLIC_KEY"

      - name: Run tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          zsh scripts/test.sh

      - name: Build, sign, validate and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Set the SPARKLE_PRIVATE_KEY repository secret before releasing.' >&2
            exit 1
          fi
          umask 077
          export SPARKLE_PRIVATE_KEY_FILE
          SPARKLE_PRIVATE_KEY_FILE="$(mktemp "$RUNNER_TEMP/jibegaza-signing.XXXXXX")"
          trap 'rm -f "$SPARKLE_PRIVATE_KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          unset SPARKLE_PRIVATE_KEY
          zsh scripts/build_app.sh --release
          zsh scripts/publish_release.sh
